services:
  mongodb:
    image: mongo:7.0
    container_name: chat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-chatdb}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - chat-network

  chat-api:
    image: slincsilver/real-time-chat-microservice:1.0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-microservice
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: ${MONGO_DB:-chatdb}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-messages}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-5}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - mongodb
    networks:
      - chat-network
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 256

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  chat-network:
    driver: bridge
